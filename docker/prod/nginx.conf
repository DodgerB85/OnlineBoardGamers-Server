server {
    listen 80;
    server_name _;

    # Game saves can be several MB; larger than nginx's 1 MB default.
    client_max_body_size 64m;

    location /static/ {
        alias /staticfiles/;
        access_log off;
    }

    location / {
        proxy_pass http://obs:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Only the host TLS proxy can reach this port; Cloudflare is the
        # public redirect layer, so Django must see the original scheme.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
