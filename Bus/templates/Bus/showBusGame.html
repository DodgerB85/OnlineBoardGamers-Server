{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="{% static 'Bus/images/bus_icon.png' %}" />

    <meta name="title" content="Online Board Gamers - Bus">
    <meta name="description"
          content="Play Splotter's Bus Online for free with others, or solo!">
    <meta name="keywords"
          content="Bus,Online,Play,Board,Game,Games,Gamers">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">
    <title>OBG - {{ gameName }}</title>

    <style>
      body {
        margin: 0px !important;
        background-color: #d4eafd;
        font-family: Arial, sans-serif;
      }
      #loadingText {
        transform: translate(-50%, 0%);
        position: absolute;
        font-size: 40px;
        margin-top: 20px;
        left: 50%;

      }
      #busLoadingImg {
        /* animation properties */
        animation-name: my-animation;
        animation-duration: 2s;
        animation-direction: alternate;
        animation-iteration-count: 1;
        /*animation-timing-function: linear;*/
        animation-timing-function: ease-in-out;
        animation-fill-mode: forwards;

        /* other properties */
        width: 300px;
        position: absolute;
        top: 50%;
        left: 20%;
        transform: translate(-50%, -50%);
      }

      @keyframes my-animation {
        from {
          left: 10%;
        }
        to {
          left: 90%;
        }
      }
    </style>
    {% if debug %}
  <script type="module" src="http://localhost:3000/static/@vite/client"></script>
  <script type="module" src="http://localhost:3000/static/main.js"></script>
    {% else %}
      <link href="{% static 'Bus/vuedist/main.css' %}?" rel="stylesheet" />
      <script type="module" crossorigin="" src="{% static 'Bus/vuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Bus is loading.........</div>
      <div>
        <img id="busLoadingImg" src="{% static 'Bus/images/bus_icon.png' %}" />
      </div>
    </div>
  </body>
  <script>
    var initData = {};

    ///////////////////////
    initData.gameID = {{ gameID }};
    initData.gameName = "{{ gameName }}";
    initData.gameData = '{{ gameData|safe }}';
    initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
    initData.myZoomLevel = {{ myZoomLevel}};
    initData.KickoutFlexiDataArray = {{KickoutFlexiDataArray|safe}};
    initData.deleteVotesData = {{ deleteVotesData | safe }};
    initData.startingOptions = '{{startingOptions}}';

    ///////////////////////
    {% if user.is_authenticated %}
    initData.name = '{{ name }}'; 
    initData.chatData = "{{ chatData }}";
    initData.preferredBusBoard = {{ preferredBusBoard }};
    initData.nextURL = '{{ nextURL }}';
    {% endif %}

    ///////////////////////
    {% if involvedPlayer %}
    initData.pov = {{pov}};
 
    initData.latestUpdate = {{latestUpdateLiteral}};
    initData.secondsToNextKickout = {{secondsToNextKickout}};
    {% if kickoutRequired > 0 and not myMove %}
      initData.kickoutRequired = {{kickoutRequired}};
    {% endif %}
    initData.notes = '{{ notes | safe }}';
    {% if chatNotification %}
    initData.chatNotification = true;
    {% endif %}
    initData.preferredBusColour = {{ preferredBusColour }};
    initData.yourTurnAudioType = {{yourTurnAudioType}};

    /////////////////////
    {% if not gameData %}
    {% if displayNames %}
    initData.displayNames = {{displayNames | safe}};
    {% endif %}
    initData.playerNames = {{allPlayerListBySeat | safe}};
    {% endif %}
    {% endif %}
  </script>
</html>
