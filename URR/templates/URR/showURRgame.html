{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en-gb' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=1400, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'Lobby/favicons/favicon-32x32.png' %}?v=20261022b" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'Lobby/favicons/favicon-16x16.png' %}?v=20261022b" />
    <link rel="icon" href="{% static 'Lobby/favicons/favicon.ico' %}?v=20261022b" />
    <meta name="title" content="Online Board Gamers - UR: 1830 BC">
    <meta name="description" content="Play Splotter's UR: 1830 BC online for free with others.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Online Board Gamers">
    <title>OBG - {{ gameName }}</title>
    <style>
      body {
        margin: 0px !important;
        background-color: #d4eafd;
        font-family: Arial, sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        min-height: 100vh;
      }
      #loadingText {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 20px;
        font-size: 40px;
        text-align: center;
        padding: 0 16px;
        box-sizing: border-box;
        z-index: 10;
      }
      /* Water runs down the canal and irrigates the desert into pasture. */
      #loadingContainer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: stretch;
      }
      .fieldCol {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .field {
        width: 92px;
        height: 52px;
        border-radius: 4px;
        background-color: #d8bd7d;
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.08);
        animation: irrigate 1s infinite;
      }
      .fieldCol .field:nth-child(2) { animation-delay: 0.15s; }
      .fieldCol .field:nth-child(3) { animation-delay: 0.3s; }
      @keyframes irrigate {
        0%, 30% { background-color: #d8bd7d; }
        55%, 85% { background-color: #7fa950; }
        100% { background-color: #d8bd7d; }
      }
      .canal {
        width: 26px;
        margin: 0 6px;
        padding: 0 4px;
        box-sizing: border-box;
        border-radius: 4px;
        background-color: #b99a5f;
        overflow: hidden;
      }
      .canal::before {
        content: "";
        display: block;
        height: 200%;
        background: repeating-linear-gradient(
          to bottom,
          #6fb0ec 0 8px,
          #3f7fc4 8px 24px
        );
        animation: waterFlow 1s infinite linear;
      }
      @keyframes waterFlow {
        from { transform: translateY(0); }
        to { transform: translateY(-24px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .field, .canal::before { animation: none; }
      }
      @media (max-width: 600px) {
        #loadingContainer { transform: translate(-50%, -50%) scale(0.7); }
      }
    </style>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDebug %}
      <script type="module" src="http://localhost:3054/static/@vite/client"></script>
      <script type="module" src="http://localhost:3054/static/main.js"></script>
    {% else %}
      <link href="{% static 'URR/URRvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module" crossorigin="" src="{% static 'URR/URRvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">{% translate "UR: 1830 BC is loading........" %}</div>
      <div id="loadingContainer" aria-hidden="true">
        <div class="fieldCol">
          <div class="field"></div>
          <div class="field"></div>
          <div class="field"></div>
        </div>
        <div class="canal"></div>
        <div class="fieldCol">
          <div class="field"></div>
          <div class="field"></div>
          <div class="field"></div>
        </div>
      </div>
    </div>
  <div hidden>{% csrf_token %}</div>
  </body>
  <script>
    var initData = {};
    initData.locale = "{{ LANGUAGE_CODE|default:'en-gb' }}";
    initData.gameID = {{ gameID }};
    initData.gameName = "{{ gameName|escapejs }}";
    initData.gameData = '{{ gameData|default:""|escapejs }}';
    initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
    initData.myZoomLevel = {{ myZoomLevel }};
    initData.startingOptions = {{ startingOptions|safe }};
    initData.KickoutFlexiDataArray = {{ KickoutFlexiDataArray|safe }};
    initData.playerNames = {{ allPlayerListBySeat|safe }};
    initData.missingPlayers = {{ missingPlayers|safe }};
    initData.currentPlayers = {{ currentPlayers|safe }};
    initData.statsExcludeVotesData = {{ statsExcludeVotesData|safe }};
    initData.deleteVotesData = {{ deleteVotesData|safe }};
    initData.pov = {{ pov }};
    initData.turn = {{ turn }};
    initData.phase = {{ phase }};
    initData.finishedGame = {{ finishedGame|lower }};

    {% if spoilerFree %}
    initData.spoilerFree = true;
    initData.replayStep = {{ replayStep }}-1;
    {% endif %}

    {% if user.is_authenticated %}
    initData.name = '{{ name|escapejs }}';
    initData.chatData = "{{ chatData }}";
    initData.latestUpdate = {{ latestUpdateLiteral }};
    initData.nextURL = '{{ nextURL|safe }}';
    initData.chatNotification = {{ chatNotification|lower }};
    {% endif %}

    initData.kickoutVotesData = {{ kickoutVotesData|default:'{}'|safe }};
    initData.kickoutVoteThreshold = {{ kickoutVoteThreshold|default:'0' }};
    {% if involvedPlayer %}
    initData.statsExcludedGame = {{ statsExcludedGame|lower }};
    initData.secondsToNextKickout = {{ secondsToNextKickout }};
    {% if kickoutRequired > 0 and not myMove %}
    initData.kickoutRequired = {{ kickoutRequired }};
    {% endif %}
    initData.notes = '{{ notes|escapejs }}';
    initData.yourTurnAudioType = {{ yourTurnAudioType }};
    {% endif %}

    {% if displayNames %}
    initData.displayNames = JSON.parse('{{ displayNames|escapejs }}');
    {% endif %}
  </script>
</html>
