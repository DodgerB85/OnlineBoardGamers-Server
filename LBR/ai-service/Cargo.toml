[package]
name = "lbr-policy"
version = "0.1.0"
edition = "2021"

# Only the modules the LBR policy needs. The donor's optional desktop (`macroquad`)
# and Python (`pyo3`/`numpy`) bindings are deliberately absent.
[dependencies]
minimax = { path = "minimax" }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
primitive-types = { version = "0.12.1", features = ["serde"] }
derive_more = "0.99.17"
once_cell = "1.17.1"
