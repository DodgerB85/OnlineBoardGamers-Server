{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en-gb' }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon"
          type="image/png"
          href="{% static 'BUS/images/bus_icon.png' %}" />
    <meta name="title" content="Online Board Gamers - BUS">
    <meta name="description"
          content="Play Splotter's BUS Online for free with others, or solo!">
    <meta name="keywords" content="BUS,Online,Play,Board,Game,Games,Gamers">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">
    <title>OBG - {{ gameName }}</title>
    <style>
      body {
        margin: 0px !important;
        background-color: #d4eafd;
        font-family: Arial, sans-serif;
      }
      #loadingText {
        transform: translate(-50%, 0%);
        position: absolute;
        font-size: 40px;
        margin-top: 20px;
        left: 50%;

      }
      #busLoadingImg {
        /* animation properties */
        animation-name: my-animation;
        animation-duration: 2s;
        animation-direction: alternate;
        animation-iteration-count: 1;
        /*animation-timing-function: linear;*/
        animation-timing-function: ease-in-out;
        animation-fill-mode: forwards;

        /* other properties */
        width: 300px;
        position: absolute;
        top: 50%;
        left: 20%;
        transform: translate(-50%, -50%);
      }

      @keyframes my-animation {
        from {
          left: 10%;
        }
        to {
          left: 90%;
        }
      }
    </style>
    <script src="{% static 'Lobby/common/msgPack.js' %}"></script>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDEBUG %}
      <script type="module" src="http://localhost:3000/static/@vite/client"></script>
      <script type="module" src="http://localhost:3000/static/main.js"></script>
    {% else %}
      <link href="{% static 'BUS/BUSvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module"
              crossorigin=""
              src="{% static 'BUS/BUSvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Bus is loading.........</div>
      <div>
        <img id="busLoadingImg"
             src="{% static 'BUS/images/bus_icon.png' %}"
             width="300"
             height="300"
             alt="VROOOMM" />
      </div>
    </div>
  <div hidden>{% csrf_token %}</div>
  </body>
  <script>
    var initData = {};

    ///////////////////////
    initData.locale = "{{ LANGUAGE_CODE|default:'en-gb' }}";
    initData.gameID = {{ gameID }};
    initData.gameName = "{{ gameName|escapejs }}";
    initData.gameData = '{{ gameData|escapejs }}';
    initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
    initData.myZoomLevel = {{ myZoomLevel}};
    initData.KickoutFlexiDataArray = {{KickoutFlexiDataArray|safe}};
    initData.startingOptions = {{startingOptions}};

    initData.deleteVotesData = {{ deleteVotesData | safe }};
    initData.statsExcludeVotesData = {{ statsExcludeVotesData | safe }};

    {% if spoilerFree %}
    initData.spoilerFree = true;
    initData.replayStep = {{replayStep}}-1;
    {% endif %}

    {% if finishedGame %}
    initData.finishedGame = true
    {% endif %}

    ///////////////////////
    {% if user.is_authenticated %}
    initData.name = '{{ name }}'; 
    initData.chatData = "{{ chatData }}";
    initData.preferredBUSoptions = {{ preferredBUSoptions|default:"[-1,0,0]"|safe }};

    initData.nextURL = '{{ nextURL|safe }}';
    {% endif %}

    initData.kickoutVotesData = {{ kickoutVotesData | default:'{}' | safe }};
    initData.kickoutVoteThreshold = {{ kickoutVoteThreshold | default:'0' }};

    ///////////////////////
    {% if involvedPlayer %}
    initData.pov = {{pov}};
 
    initData.latestUpdate = {{latestUpdateLiteral}};
    initData.secondsToNextKickout = {{secondsToNextKickout}};
    {% if kickoutRequired > 0 and not myMove %}
      initData.kickoutRequired = {{kickoutRequired}};
    {% endif %}
    initData.notes = '{{ notes | escapejs }}';
    {% if chatNotification %}
    initData.chatNotification = true;
    {% endif %}

    initData.yourTurnAudioType = {{yourTurnAudioType}};

    /////////////////////
    {% if not gameData %}
    {% if displayNames %}
    initData.displayNames = JSON.parse('{{ displayNames|escapejs }}');
    {% endif %}
    initData.playerNames = {{allPlayerListBySeat | safe}};
    {% endif %}
    {% endif %}
  </script>
</html>
