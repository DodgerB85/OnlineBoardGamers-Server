{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="title" content="Online Board Gamers - Keyflower">
    <meta name="description"
          content="Play Keyflower Online for free with others, or solo!">
    <meta name="keywords"
          content="Keyflower,Online,Play,Board,Game,Games,Gamers">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">

    <link rel="icon" type="image/png" href="{% static 'KFW/images/kfw_icon.png' %}" />
    <title>OBG - {{ gameName }}</title>
    <style>
    body {
      margin: 0px !important;
      background-color: #d4eafd;
      font-family: Arial, sans-serif;

    }

    #loadingText {
      transform: translate(-50%, 0%);
      position: absolute;
      font-size: 40px;
      margin-top: 20px;
      left: 50%;
      white-space: nowrap;
    }

    #KFWloadingImg {
      /* animation properties */
      animation-name: my-animation;
      animation-duration: 1s;
      animation-direction: alternate;
      animation-iteration-count: 1;
      /*animation-timing-function: linear;*/
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;

      /* other properties */
      width: 500px;
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translate(-50%, -0%);
    }

    @keyframes my-animation {
      from {
        height: 1px;
      }

      to {
        height: 500px;
      }
    }
    </style>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDEBUG %}
      <script type="module" src="http://localhost:3030/static/@vite/client"></script>
      <script type="module" src="http://localhost:3030/static/main.js"></script>
    {% else %}
      <link href="{% static 'KFW/KFWvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module"
              crossorigin=""
              src="{% static 'KFW/KFWvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Keyflower is loading........</div>
      <div>
        <img id="KFWloadingImg" src="{% static 'KFW/images/kfw_logo.png' %}" />
        <div class="seaWaves"></div>
      </div>
    </div>
  </body>
  <script>
  var initData = {};
  
  ///////////////////////
  initData.gameID = {{ gameID }};
  initData.gameName = "{{ gameName }}";
  initData.gameData = '{{ gameData|safe }}';
  initData.gameData1 = '{{ gameData1|safe }}';
  initData.gameData3 = '{{ gameData3|safe }}';
  initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
  initData.myZoomLevel = {{ myZoomLevel }};
  initData.KickoutFlexiDataArray = {{KickoutFlexiDataArray|safe}};
  initData.startingOptions = {{startingOptions}};
  initData.playerNames = {{ allPlayerListBySeat | safe }};
  initData.currentPlayers = {{ currentPlayers | safe }};
  initData.preferredKFWoptions = {{ preferredKFWoptions }};
  initData.pov = {{ pov }};
  initData.move = "{{move}}";
  initData.turn = {{turn}};

  {% if finishedGame %}
  initData.finishedGame = true
  {% endif %}

  {% if spoilerFree %}
  initData.spoilerFree = true;
  initData.replayStep = {{replayStep}}-1;
  {% endif %}

  ///////////////////////
  {% if user.is_authenticated %}
  initData.name = '{{ name }}';
  initData.chatData = "{{ chatData }}";
  initData.latestUpdate = {{ latestUpdateLiteral }};
  initData.nextURL = '{{ nextURL|safe }}';
  {% if chatNotification %}
  initData.chatNotification = true;
  {% endif %}
  {% endif %}

  ///////////////////////
  {% if involvedPlayer %}
  initData.statsExcludedGame = {{ statsExcludedGame|lower }};

  
  initData.secondsToNextKickout = {{ secondsToNextKickout }};
  {% if kickoutRequired > 0 and not myMove %}
  initData.kickoutRequired = {{kickoutRequired}};
  {% endif %}
  initData.notes = '{{ notes | safe }}';
  initData.yourTurnAudioType = {{ yourTurnAudioType }};

  /////////////////////
  {% if not gameData %}
  {% if displayNames %}
  initData.displayNames = {{ displayNames | safe }};
  {% endif %}
  initData.playerNames = {{ allPlayerListBySeat | safe }};
  {% endif %}
  {% endif %}
  </script>
</html>
