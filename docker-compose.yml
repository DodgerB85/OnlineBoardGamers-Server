services:
  db:
    image: mysql:9.5
    volumes:
      - data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: obs
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpass
    restart: always
    ports:
      - "3307:3306"

  obs:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    links:
      - db
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: password
      # The Docker stack always uses the db service, even if .env was switched
      # to SQLite by the quick setup route.
      LOCAL_USER_SQLITE3: "False"
      LOCAL_DB_HOST: db
      LOCAL_DB_NAME: obs
      LOCAL_DB_USER: user
      LOCAL_DB_PWD: pass
    env_file:
      - .env

  worker:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    links:
      - db
    environment:
      LOCAL_USER_SQLITE3: "False"
      LOCAL_DB_HOST: db
      LOCAL_DB_NAME: obs
      LOCAL_DB_USER: user
      LOCAL_DB_PWD: pass
    env_file:
      - .env
    command: python manage.py qcluster
    restart: on-failure

  aqy:
    build:
      context: ./AQY/vueAQY
      dockerfile: ../../vue.Dockerfile
    working_dir: /app
    volumes:
      - ./AQY/vueAQY/src:/app/src
      - ./AQY/static/AQY:/static/AQY
    ports:
      - "3018:3018"

  bus:
