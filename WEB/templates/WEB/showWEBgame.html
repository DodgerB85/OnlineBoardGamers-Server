{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Online Board Gamers - Web">
    <meta name="description"
          content="Play Web Online for free with others, or solo!">
    <meta name="keywords"
          content="Web,Online,Play,Board,Game,Games,Gamers,Splotter">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">
    <link rel="icon"
          type="image/png"
          href="{% static 'WEB/images/web_icon.png' %}" />
    <title>OBG - {{ gameName }}</title>
    <style>
    body {
      margin: 0px !important;
      background-color: #d4eafd;
      font-family: Arial, sans-serif;
      box-sizing: border-box; /* Ensure padding/margins are included in width */
    }

    #loadingText {
      transform: translate(-50%, 0%);
      position: absolute;
      font-size: 40px;
      margin-top: 20px;
      left: 50%;
      white-space: nowrap;
      z-index: 10; /* Ensure text is above animation */
    }

    /* Container for the loading animation */
    #loadingContainer {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px; /* 5px gap from screen edges on small screens */
      box-sizing: border-box; /* Ensure padding is included in width */
    }

    /* Left image (s1) */
    #s1Image {
      width: 100px;
      height: 100px;
      position: absolute;
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Right image container for c1, c2, c3, c4 */
    #rightImageContainer {
      position: absolute;
      right: 5px; /* Ensure 5px gap from right edge */
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      height: 100px;
    }

    /* Right images with animation */
    .rightImage {
      width: 100%;
      height: 100%;
      position: absolute;
      opacity: 0;
      animation: cycleRightImages 1s infinite ease-in-out;
    }

    #c1Image { animation-delay: 0s; }
    #c2Image { animation-delay: 0.25s; }
    #c3Image { animation-delay: 0.5s; }
    #c4Image { animation-delay: 0.75s; }

    @keyframes cycleRightImages {
      0%, 25% { opacity: 1; }
      25.01%, 100% { opacity: 0; }
    }

    /* Cables container to fill space between images */
    #cablesContainer {
      position: absolute;
      left: 110px; /* s1 width (100px) + 5px gap + 5px padding */
      right: 110px; /* c1-c4 width (100px) + 5px gap */
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
    }

    /* Individual cables */
    .cable {
      height: 10px; /* Thickness of the cable */
      background-color: #3474a9; /* Background color */
      border: 1px solid black; /* Border */
      opacity: 0;
      flex: 1; /* Equal width for each cable */
      max-width: 100px; /* Maximum width for each cable */
      margin: 0 2px; /* Small gap between cables */
    }

    #cable1 { animation: showCable1 1s infinite ease-in-out;}
    #cable2 { animation: showCable2 1s infinite ease-in-out;}
    #cable3 { animation: showCable3 1s infinite ease-in-out;}
    #cable4 { animation: showCable4 1s infinite ease-in-out;}


    @keyframes showCable1 {
      0% { opacity: 0; }
      0.01%, 10% { opacity: 1; } /* Visible from delay until 2s */
      99% { opacity: 1; }
       99.01%, 100% { opacity: 0; } /* Hidden at cycle end */
    }

       @keyframes showCable2 {
      0%, 25% { opacity: 0; }
      25.01%, 35% { opacity: 1; } /* Visible from delay until 2s */
            99% { opacity: 1; }
       99.01%, 100% { opacity: 0; } /* Hidden at cycle end */
    }

           @keyframes showCable3 {
      0%, 50% { opacity: 0; }
      50.01%, 60% { opacity: 1; } /* Visible from delay until 2s */
            99% { opacity: 1; }
       99.01%, 100% { opacity: 0; } /* Hidden at cycle end */
    }

           @keyframes showCable4 {
      0%, 75% { opacity: 0; }
      75.01%, 85% { opacity: 1; } /* Visible from delay until 2s */
            99% { opacity: 1; }
       99.01%, 100% { opacity: 0; } /* Hidden at cycle end */
    }

    /* For screens wider than 600px: Center the animation */
    @media (min-width: 600.001px) {
      #loadingContainer {
        width: 528px; /* 100px (s1) + 5px + 4x100px (cables) + 8px (gaps) + 100px (c1-c4) + 5px */
        margin: 0 auto; /* Center horizontally */
        padding: 0; /* Remove padding */
      }
      #s1Image {
        left: 5px; /* 5px gap from left of #loadingContainer */
      }
      #rightImageContainer {
        right: 5px; /* 5px gap from right of #loadingContainer */
      }
      #cablesContainer {
        left: 110px; /* s1 width (100px) + 5px gap + 5px padding */
        right: 110px; /* c1-c4 width (100px) + 5px gap */
      }
    }

    /* For screens 600px or narrower: Stretch cables, keep images at edges */
    @media (max-width: 600px) {
      #loadingContainer {
        width: 100%;
        padding: 0 5px;
        box-sizing: border-box; /* Ensure padding is included in width */
      }
      #s1Image {
        left: 5px;
      }
      #rightImageContainer {
        right: 5px; /* Ensure 5px gap from right edge */
      }
      #cablesContainer {
        left: 110px; /* s1 width (100px) + 5px gap + 5px padding */
        right: 110px; /* c1-c4 width (100px) + 5px gap */
      }
      .cable {
        max-width: none; /* Allow cables to shrink */
      }
    }
    </style>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDEBUG %}
      <script type="module" src="http://localhost:3036/static/@vite/client"></script>
      <script type="module" src="http://localhost:3036/static/main.js"></script>
    {% else %}
      <link href="{% static 'WEB/WEBvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module"
              crossorigin=""
              src="{% static 'WEB/WEBvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Web is loading........</div>
      <div id="loadingContainer">
        <img id="s1Image" src="{% static 'WEB/images/s1.jpg' %}" alt="s1" />
        <div id="cablesContainer">
          <div id="cable1" class="cable"></div>
          <div id="cable2" class="cable"></div>
          <div id="cable3" class="cable"></div>
          <div id="cable4" class="cable"></div>
        </div>
        <div id="rightImageContainer">
          <img id="c1Image"
               class="rightImage"
               src="{% static 'WEB/images/c1.jpg' %}"
               alt="c1" />
          <img id="c2Image"
               class="rightImage"
               src="{% static 'WEB/images/c2.jpg' %}"
               alt="c2" />
          <img id="c3Image"
               class="rightImage"
               src="{% static 'WEB/images/c3.jpg' %}"
               alt="c3" />
          <img id="c4Image"
               class="rightImage"
               src="{% static 'WEB/images/c4.jpg' %}"
               alt="c4" />
        </div>
      </div>
    </div>
  </body>
  <script>
  var initData = {};
  
  initData.gameID = {{ gameID }};
  initData.gameName = "{{ gameName }}";
  initData.gameData = '{{ gameData|safe }}';
  initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
  initData.myZoomLevel = {{ myZoomLevel }};
  initData.KickoutFlexiDataArray = {{KickoutFlexiDataArray|safe}};
  initData.startingOptions = {{startingOptions}};
  initData.playerNames = {{ allPlayerListBySeat | safe }};
  initData.currentPlayers = '{{ currentPlayers }}'
  initData.preferredWEBoptions = {{ preferredWEBoptions }};
  initData.pov = {{ pov }};
  initData.turn = {{turn}};
  initData.deleteVotesData = {{ deleteVotesData | safe }};
  initData.statsExcludeVotesData = {{ statsExcludeVotesData | safe }};
  
  {% if finishedGame %}
  initData.finishedGame = true
  {% endif %}

  {% if spoilerFree %}
  initData.spoilerFree = true;
  initData.replayStep = {{replayStep}}-1;
  {% endif %}

  {% if user.is_authenticated %}
  initData.name = '{{ name }}';
  initData.chatData = "{{ chatData }}";
  initData.latestUpdate = {{ latestUpdateLiteral }};
  initData.nextURL = '{{ nextURL|safe }}';
  {% if chatNotification %}
  initData.chatNotification = true;
  {% endif %}
  {% endif %}

  {% if involvedPlayer %}
  initData.secondsToNextKickout = {{ secondsToNextKickout }};
  {% if kickoutRequired > 0 and not myMove %}
  initData.kickoutRequired = {{kickoutRequired}};
  {% endif %}
  initData.notes = '{{ notes | safe }}';
  initData.yourTurnAudioType = {{ yourTurnAudioType }};

  {% if not gameData %}
  {% if displayNames %}
  initData.displayNames = {{ displayNames | safe }};
  {% endif %}
  initData.playerNames = {{ allPlayerListBySeat | safe }};
  {% endif %}
  {% endif %}
  </script>
</html>
