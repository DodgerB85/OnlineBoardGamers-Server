{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon"
          type="image/png"
          href="{% static 'RNB/images/rnb_icon.png' %}" />
    <meta name="title" content="Online Board Gamers - Roads & Boats">
    <meta name="description"
          content="Play Splotter's Roads & Boats Online for free with others, or solo!">
    <meta name="keywords"
          content="Roads & Boats,Online,Play,Board,Game,Games,Gamers">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">
    <title>OBG - {{ gameName }}</title>
    <style>
    body {
      margin: 0px !important;
      background-color: #d4eafd;
      font-family: Arial, sans-serif;

    }

    #app {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    #loadingText {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 40px;
      margin-top: 20px;
      padding: 0 16px;
      box-sizing: border-box;
    }

    :root {
      --rnb-load-duration: 1s;
    }

    #loadingAnimation {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 470px;
      height: 240px;
    }

    .road-path {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      height: 100px;
      pointer-events: none;
      z-index: 1;
    }

    .hex-tile {
      position: absolute;
      bottom: 0;
      width: 200px;
      height: 200px;
      overflow: visible;
    }

    .hex-woods { left: 0; }

    .hex-woods svg,
    .hex-pasture svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hex-pasture { right: 0; }

    .hex-building {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      overflow: hidden;
      z-index: 2;
    }

    .hex-building > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      filter: drop-shadow(2px 0 0 black) drop-shadow(-2px 0 0 black) drop-shadow(0 2px 0 black) drop-shadow(0 -2px 0 black);
    }

    .trunks-on-hex {
      position: absolute;
      bottom: 156px;
      left: 64px;
      width: 40px;
      height: 40px;
      overflow: hidden;
      z-index: 4;
      animation: trunks-to-donkey var(--rnb-load-duration) linear forwards;
    }

    .trunks-on-hex > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      filter: drop-shadow(2px 0 0 black) drop-shadow(-2px 0 0 black) drop-shadow(0 2px 0 black) drop-shadow(0 -2px 0 black);
    }

    .donkey-wrapper {
      position: absolute;
      bottom: 40px;
      left: 120px;
      z-index: 3;
      animation: donkey-journey var(--rnb-load-duration) linear forwards;
    }

    .donkey-wrapper > img {
      width: 64px;
      height: 64px;
      image-rendering: pixelated;
      filter: drop-shadow(2px 0 0 black) drop-shadow(-2px 0 0 black) drop-shadow(0 2px 0 black) drop-shadow(0 -2px 0 black);
    }

    @keyframes donkey-journey {
      0%, 30% { transform: translateX(0); }
      75% { transform: translateX(170px); }
      100% { transform: translateX(170px); }
    }

    @keyframes trunks-to-donkey {
      0% { transform: translate(0, 0) scale(0.7); opacity: 1; }
      30% { transform: translate(58px, 85px) scale(0.5); opacity: 1; }
      75% { transform: translate(228px, 85px) scale(0.5); opacity: 1; }
      95% { transform: translate(248px, 30px) scale(0.7); opacity: 1; }
      100% { transform: translate(248px, 30px) scale(0.7); opacity: 0; }
    }

    .boards-wrapper {
      position: absolute;
      left: 312px;
      bottom: 126px;
      width: 40px;
      height: 40px;
      z-index: 5;
      overflow: visible;
      pointer-events: none;
    }

    .board {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      margin-top: -14px;
      margin-left: -14px;
    }

    .board > img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      filter: drop-shadow(1px 0 0 black) drop-shadow(-1px 0 0 black) drop-shadow(0 1px 0 black) drop-shadow(0 -1px 0 black);
    }

    .board-left {
      animation: board-explode-left var(--rnb-load-duration) linear forwards;
    }

    .board-right {
      animation: board-explode-right var(--rnb-load-duration) linear forwards;
    }

    .firework {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      z-index: 6;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 5px;
      margin: -2.5px 0 0 -2.5px;
      border-radius: 50%;
      animation: spark-fly var(--rnb-load-duration) linear forwards;
    }

    .spark-gold { background: #f5c842; }
    .spark-orange { background: #ff9800; }
    .spark-red { background: #f44336; }
    .spark-white { background: #ffffff; }
    .spark-n { --tx: 0px; --ty: -28px; }
    .spark-ne { --tx: 20px; --ty: -20px; }
    .spark-e { --tx: 28px; --ty: 0px; }
    .spark-se { --tx: 20px; --ty: 20px; }
    .spark-s { --tx: 0px; --ty: 28px; }
    .spark-sw { --tx: -20px; --ty: 20px; }
    .spark-w { --tx: -28px; --ty: 0px; }
    .spark-nw { --tx: -20px; --ty: -20px; }
    .spark-ne2 { --tx: 14px; --ty: -14px; }
    .spark-se2 { --tx: 14px; --ty: 14px; }
    .spark-sw2 { --tx: -14px; --ty: 14px; }
    .spark-nw2 { --tx: -14px; --ty: -14px; }

    @keyframes spark-fly {
      0%, 75% { opacity: 0; transform: translate(0, 0) scale(0); }
      80% { opacity: 1; transform: translate(0, 0) scale(1.2); }
      95% { opacity: 0.7; transform: translate(var(--tx), var(--ty)) scale(0.7); }
      98% { opacity: 0.3; transform: translate(var(--tx), var(--ty)) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
    }

    @keyframes board-explode-left {
      0%, 80% { opacity: 0; transform: translate(0, 0) scale(0); }
      100% { opacity: 1; transform: translate(-18px, -15px) scale(1); }
    }

    @keyframes board-explode-right {
      0%, 80% { opacity: 0; transform: translate(0, 0) scale(0); }
      100% { opacity: 1; transform: translate(18px, -15px) scale(1); }
    }

    </style>
    <script src="{% static 'Lobby/common/msgPack.js' %}"></script>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDebug %}
      <script type="module" src="http://localhost:3042/static/@vite/client"></script>
      <script type="module" src="http://localhost:3042/static/main.js"></script>
    {% else %}
      <link href="{% static 'RNB/RNBvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module"
              crossorigin=""
              src="{% static 'RNB/RNBvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Roads & Boats is loading........</div>
      <div id="loadingAnimation">
        <div class="hex-tile hex-woods">
          <svg width="200" height="200" viewBox="0 0 56 56" xmlns="http://w3.org">
            <defs>
            <!-- Pattern to quickly distribute trees across the canvas -->
            <pattern id="treePattern" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M 3,1 L 1,5 L 5,5 Z" fill="#0d2612" opacity="0.85" />
            <path d="M 4,4 L 3,6 L 5,6 Z" fill="#061a0a" opacity="0.6" />
            </pattern>
            <!-- Clip path to keep everything within the hex bounds -->
            <clipPath id="hexClip">
            <polygon points="28,0 54,14 54,42 28,56 2,42 2,14" />
            </clipPath>
            </defs>
            <g clip-path="url(#hexClip)">
            <!-- 1. Base Green Grass -->
            <polygon points="28,0 54,14 54,42 28,56 2,42 2,14" fill="#52b145" />
            <!-- 2. Dense Forest Texture Layer -->
            <rect width="56" height="56" fill="url(#treePattern)" />
            <!-- 3. The Blue River (including the central island split) -->
            <path d="M 11,8 C 14,14 18,22 24,28 C 25,27 27,27 29,28 C 33,31 32,36 34,42 C 36,46 41,50 44,52 L 38,55 C 34,51 31,46 29,40 C 27,41 24,39 23,36 C 17,31 13,22 7,13 Z" fill="#3b66cc" />
            <!-- 4. Inner River highlights to mimic the original brushstrokes -->
            <path d="M 11,9 C 14,15 18,23 23,28 M 28,32 C 31,35 31,39 33,43" stroke="#5588ff" stroke-width="0.8" fill="none" opacity="0.6" />
            </g>
          </svg>
        </div>
        <div class="hex-tile hex-pasture">
          <svg width="200" height="200" viewBox="0 0 56 56" xmlns="http://w3.org">
            <!-- Yellow-Green Hexagonal Base -->
            <polygon points="28,0 54,14 54,42 28,56 2,42 2,14" fill="#a4cf2b" />
            <!-- Sketchy Central Black Ring -->
            <ellipse cx="32" cy="29" rx="7" ry="4" fill="none" stroke="#111111" stroke-width="1.2" transform="rotate(-22, 32, 29)" stroke-dasharray="3,1,1,1,2,1" />
            <ellipse cx="32.2" cy="28.8" rx="6.8" ry="3.8" fill="none" stroke="#111111" stroke-width="0.8" transform="rotate(-20, 32, 29)" stroke-dasharray="1,2,3,1" />
          </svg>
          <div class="hex-building">
            <img src="{% static 'RNB/images/buildings/bldg_sawmill.jpg' %}"
                 alt="sawmill"
                 width="48"
                 height="48" />
          </div>
        </div>
        <svg class="road-path" viewBox="0 0 470 100" preserveAspectRatio="none">
          <path d="M 150 30 L 170 85 L 290 85 L 370 30" stroke="#1C2526" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" fill="none" />
          <path d="M 150 30 L 170 85 L 290 85 L 370 30" stroke="#F5F5F5" stroke-width="4" stroke-dasharray="18 14" stroke-linejoin="round" stroke-linecap="round" fill="none" />
        </svg>
        <div class="trunks-on-hex">
          <img src="{% static 'RNB/images/resources/res_trunks.jpg' %}"
               alt="trunks"
               width="40"
               height="40" />
        </div>
        <div class="boards-wrapper">
          <div class="firework">
            <div class="spark spark-gold spark-n"></div>
            <div class="spark spark-orange spark-ne"></div>
            <div class="spark spark-red spark-e"></div>
            <div class="spark spark-orange spark-se"></div>
            <div class="spark spark-gold spark-s"></div>
            <div class="spark spark-orange spark-sw"></div>
            <div class="spark spark-red spark-w"></div>
            <div class="spark spark-orange spark-nw"></div>
            <div class="spark spark-white spark-ne2"></div>
            <div class="spark spark-white spark-nw2"></div>
            <div class="spark spark-white spark-se2"></div>
            <div class="spark spark-white spark-sw2"></div>
          </div>
          <div class="board board-left">
            <img src="{% static 'RNB/images/resources/res_boards.jpg' %}"
                 alt="boards"
                 width="28"
                 height="28" />
          </div>
          <div class="board board-right">
            <img src="{% static 'RNB/images/resources/res_boards.jpg' %}"
                 alt="boards"
                 width="28"
                 height="28" />
          </div>
        </div>
        <div class="donkey-wrapper">
          <img src="{% static 'RNB/images/transporters/transport_donkey_blue.png' %}"
               alt="donkey"
               width="64"
               height="64" />
        </div>
      </div>
    </div>
  </body>
