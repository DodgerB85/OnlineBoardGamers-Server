{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon"
          type="image/png"
          href="{% static 'RNB/images/rnb_icon.png' %}" />
    <meta name="title" content="Online Board Gamers - Antiquity">
    <meta name="description"
          content="Play Splotter's Antiquity Online for free with others, or solo!">
    <meta name="keywords"
          content="Antiquity,Online,Play,Board,Game,Games,Gamers">
    <meta name="robots" content="index, follow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="language" content="English">
    <meta name="revisit-after" content="200 days">
    <meta name="author" content="Online Board Gamers">
    <title>OBG - {{ gameName }}</title>
    <style>
    body {
      margin: 0px !important;
      background-color: #d4eafd;
      font-family: Arial, sans-serif;

    }

    #loadingText {
      transform: translate(-50%, 0%);
      position: absolute;
      font-size: 40px;
      margin-top: 20px;
      left: 50%;
      white-space: nowrap;
    }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
    <script src="{% static 'Lobby/common/pakoLib.js' %}"></script>
    {% if settingsDebug %}
      <script type="module" src="http://localhost:3042/static/@vite/client"></script>
      <script type="module" src="http://localhost:3042/static/main.js"></script>
    {% else %}
      <link href="{% static 'RNB/RNBvuedist/main.css' %}?" rel="stylesheet" />
      <script type="module"
              crossorigin=""
              src="{% static 'RNB/RNBvuedist/main.js' %}"></script>
    {% endif %}
  </head>
  <body>
    <noscript>
      <strong>Please enable Javascript to continue.</strong>
    </noscript>
    <div id="app">
      <div id="loadingText">Roads & Boats is loading........</div>
    </div>
  </body>

  var initData = {};
  // V2
  initData.gameID = {{ gameID }};
  initData.gameName = "{{ gameName }}";
  initData.gameDataB64  = '{{ gameDataB64 | safe }}';
  initData.gameCreationTimestamp = {{ gameCreationTimestamp }};
  initData.myZoomLevel = {{ myZoomLevel }};
  initData.startingOptions = {{startingOptions}};
  initData.KickoutFlexiDataArray = {{KickoutFlexiDataArray|safe}};
  initData.playerNames = {{ allPlayerListBySeat | safe }};
  initData.currentPlayers = {{ currentPlayers | safe }};
  initData.preferredRNBoptions = {{ preferredRNBoptions }};
  initData.statsExcludeVotesData = {{ statsExcludeVotesData | safe }};
  initData.deleteVotesData = {{ deleteVotesData | safe }};
  initData.pov = {{ pov }};
  initData.startingMap = {{ startingMap|safe }};
  initData.turn = {{turn}};

  // Finished Game
  initData.finishedGame = {{finishedGame|lower}};

  {% if spoilerFree %}
  initData.spoilerFree = true;
  initData.replayStep = {{replayStep}}-1;
  {% endif %}

  ///////////////////////
  {% if user.is_authenticated %}
  initData.name = '{{ name }}';
  initData.chatData = "{{ chatData }}";
  initData.latestUpdate = {{ latestUpdateLiteral }};
  initData.nextURL = '{{ nextURL|safe }}';
  initData.chatNotification = {{chatNotification|lower}};
  {% endif %}

  ///////////////////////
  {% if involvedPlayer %}
  initData.currentMoveData = {{ currentMoveData | safe }};
  initData.allMyMoveData = {{ allMyMoveData|safe  }};
  initData.statsExcludedGame = {{ statsExcludedGame|lower }};
  initData.secondsToNextKickout = {{ secondsToNextKickout }};
  initData.trade = '{{ trade }}';
  {% if kickoutRequired > 0  %}
  initData.kickoutRequired = {{kickoutRequired}};
  {% endif %}
  initData.notes = '{{ notes | safe }}';
  initData.yourTurnAudioType = {{ yourTurnAudioType }};
initData.preMove = "{{preMove}}";

  {% if not gameData %}
  {% if displayNames %}
  initData.displayNames = {{ displayNames | safe }};
