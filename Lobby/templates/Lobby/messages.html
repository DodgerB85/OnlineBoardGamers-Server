{% if messages %}
<div class="messages">
  {% for message in messages %}
  <div class="pill message-box {% if message.tags == 'success' %}pill-positive{% elif message.tags == 'error' %}pill-danger{% elif message.tags == 'warning' %}pill-warn{% else %}pill-accent{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
