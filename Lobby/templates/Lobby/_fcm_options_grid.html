{% load i18n %}
<div class="nd-opts-grid">
<div class="nd-opts-section nd-opts-slate">
  <div class="nd-section-title">{% trans "Game Options" %}</div>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="hardChoices" name="hardChoices" value="8" />
    <div>
      <div>{% trans "Hard Choices with Original Milestones" %}</div>
      <div class="nd-opt-help">{% trans "First to train / First to market good disappear after 2 turns. First to hire 3 disappears after 3 turns." %}</div>
    </div>
  </label>
  <div class="nd-section-title" style="margin-top:10px;font-size:11px">{% trans "Rarely used" %}</div>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="short" name="short" value="1" />
    <div>
      <div>{% trans "Short Game" %}</div>
      <div class="nd-opt-help">{% trans "No salaries, bank only breaks once, extra money" %}</div>
    </div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="noMilestones" name="noMilestones" value="2" />
    <div>{% trans "Do not use milestones" %}</div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="noCeoMilestone" name="noCeoMilestone" value="3" />
    <div>{% trans "No CFO Milestone" %}</div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="noRadioMilestone" name="noRadioMilestone" value="6" />
    <div>{% trans "No Radio Milestone" %}</div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="sandboxMode" name="sandboxMode" value="103" />
    <div>{% trans "Sandbox Mode" %} (<a href="{% url 'FCM:FCMhelp' %}" target="_blank">{% trans "Help" %}</a>)</div>
  </label>
</div>

<div class="nd-opts-section nd-opts-red">
  <div class="nd-section-title">{% trans "Ketchup Options" %}</div>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="newMilestones" name="newMilestones" value="21" />
    <div>{% trans "Use New Milestones" %}</div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="ketchupMilestone" name="ketchupMilestone" value="20" />
    <div>
      <div>{% trans "Use Ketchup Milestone" %}</div>
      <div class="nd-opt-help">{% trans "The first time someone else sells your demand, gain a permanent -1 to distance" %}</div>
    </div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="reservePrice" name="reservePrice" value="23" />
    <div>
      <div>{% trans "Use Price Changing Reserve Cards" %}</div>
      <div class="nd-opt-help">{% trans "When the bank breaks, add $200 per player. The base price changes to whichever is selected most, from $5, $10, or $20." %}</div>
    </div>
  </label>
</div>

<div class="nd-opts-section nd-opts-green">
  <div class="nd-section-title">{% trans "Map / Route Options" %}</div>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="newDistricts" name="newDistricts" value="18" />
    <div>
      <div>{% trans "Use New Districts" %}</div>
      <div class="nd-opt-help">{% trans "Add new tiles to the pool to make the map" %}</div>
    </div>
  </label>
  <label class="nd-check-label" style="margin-left:20px">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="newDistrictsApp" name="newDistrictsApp" value="181" />
    <div>{% trans "Guarantee at least 1 Apartment" %}</div>
  </label>
  <label class="nd-check-label" style="margin-left:20px">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="newDistrictsPark" name="newDistrictsPark" value="183" />
    <div>{% trans "Guarantee the Parks tile" %}</div>
  </label>
  <label class="nd-check-label" style="margin-left:20px">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="newDistrictsAll" name="newDistrictsAll" value="182" />
    <div>{% trans "Use all 5 new tiles plus random others" %}</div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="lobbyists" name="lobbyists" value="22" />
    <div>
      <div>{% trans "Use Lobbyists" %}</div>
      <div class="nd-opt-help">{% trans "Add new roads and parks to the map" %}</div>
    </div>
  </label>
  <label class="nd-check-label">
    <input type="checkbox" onchange="validateOptions(this.id)" class="myCheckbox individualOpt" id="coffee" name="coffee" value="19" />
    <div>
      <div>{% trans "Use Coffee" %}</div>
      <div class="nd-opt-help">{% trans "Sell coffee along the route travelled by a house" %}</div>
    </div>
  </label>
</div>

  <div class="nd-section-title">
    {% trans "China Expansion" %}
