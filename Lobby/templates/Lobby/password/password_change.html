{% extends "Lobby/layout.html" %}

{% block body %}


<div class="nd-page nd-page-narrow" style="margin-top: 24px;">
    {% include 'Lobby/_messages.html' %}

    {% if message %}
        <div class="nd-pill nd-pill-accent" style="display:inline-block; margin-bottom: 12px;">{{ message }}</div>
    {% endif %}

    <div class="nd-card nd-section">
        <div class="nd-card-header"><h2 class="nd-card-title">Change Password</h2></div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="nd-row-flex" style="gap: 8px; margin-top: 12px;">
                <a class="nd-button" href="{% url 'index' %}">Back</a>
                <button class="nd-button nd-button-primary" type="submit">Submit</button>
            </div>
        </form>
    </div>
</div>


{% endblock %}
