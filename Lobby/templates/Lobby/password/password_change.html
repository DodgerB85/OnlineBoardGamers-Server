{% extends "Lobby/layout.html" %}
{% load i18n %}

{% block body %}


<div class="page page-narrow" style="margin-top: 24px;">
    {% include 'Lobby/messages.html' %}

    {% if message %}
        <div class="pill pill-accent" style="display:inline-block; margin-bottom: 12px;">{{ message }}</div>
    {% endif %}

    <div class="card section">
        <div class="card-header"><h2 class="card-title">{% translate "Change Password" %}</h2></div>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="row-flex" style="gap: 8px; margin-top: 12px;">
                <a class="button" href="{% url 'index' %}">{% translate "Back" %}</a>
                <button class="button button-primary" type="submit">{% translate "Submit" %}</button>
            </div>
        </form>
    </div>
</div>


{% endblock %}
