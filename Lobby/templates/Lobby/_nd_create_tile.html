{% load static i18n %}
<a class="nd-card nd-game-card nd-create-tile" href="{% url url %}">
  <div class="nd-game-card-img">
    <img src="{% static img %}" alt="{{ title }}">
  </div>
  <div class="nd-game-card-body">
    <h3>{{ title }}</h3>
    <span class="nd-button nd-button-primary nd-button-sm">{% translate "Create" %}</span>
  </div>
</a>
