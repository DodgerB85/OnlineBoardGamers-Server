{% load i18n %}
<div class="nd-empty-card">
  <p class="nd-empty-msg">{{ message|default:"Nothing here yet." }}</p>
  {% if showNewGame %}
    <a class="nd-empty-cta" href="{% url 'newGamesPage' %}">+ {% translate "Start a new game" %}</a>
  {% endif %}
  <p class="nd-empty-hint">
    {% url 'lobbyHelp' as help_url %}
    {% blocktranslate trimmed %}
      Need a refresher on the icons? <a href="{{ help_url }}">See Help</a>.
    {% endblocktranslate %}
  </p>
</div>
