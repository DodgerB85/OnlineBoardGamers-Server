<!DOCTYPE html>
<html>
<head>
    <title>User Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <canvas id="userChart" width="400" height="200"></canvas>

    <script>
        var ctx = document.getElementById('userChart').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ dates|safe }},
                datasets: [{
                    label: 'Total Users',
                    data: {{ user_counts|safe }},
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

    <br/>
    <br/>
    Last Login Cumulative<br/>
    <br/>
    <!-- Create a canvas element for the chart -->
<canvas id="userLoginChart"></canvas>

<script>
    // Access the graph data passed from the view
    var graphData = {{ last_login_data|safe }};

    var labels = graphData.map(item => item.date);
    var data = graphData.map(item => item.count);

    var ctx = document.getElementById('userLoginChart').getContext('2d');
    var myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'User Logins',
                data: data,
                fill: false,
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        },
        options: {
            // Add your chart options here
        }
    });
</script>
<br/>
<br/>
Last Login Bar Chart<br/>
<br/>
<br/>
<canvas id="userLoginBarChart"></canvas>

<script>
    var chartData = {{ last_login_data_bar|safe }};

    var dates = chartData.map(item => item.date);
    var counts = chartData.map(item => item.count);

    var ctx = document.getElementById('userLoginBarChart').getContext('2d');
    var myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: dates,
            datasets: [{
                label: 'Number of Users',
                data: counts,
                backgroundColor: 'rgba(54, 162, 235, 0.8)',
                borderWidth: 1
            }]
        },
        options: {
            // Add your chart options here
        }
    });
</script>
<br/>
<br/>
Join to Last Login Bar Chart<br/>
<br/>
<br/>
<body>
    <canvas id="userActivityDurationLineGraph"></canvas>

    <script>
        var chartData = {{ join_to_last_login_data|safe }};


        chartData.sort((a, b) => a.days_between - b.days_between);

        var daysBetween = chartData.map(item => item.days_between);
        var counts = chartData.map(item => item.count);

        var labels = daysBetween.map(day => `${day} Days`);

        var ctx = document.getElementById('userActivityDurationLineGraph').getContext('2d');
        var myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Number of Users',
                    data: counts,
                    fill: false,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    tension: 0.4
                }]
            },
            options: {
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Days Between Last Login and Join Date'
                        },
                        ticks: {
                            stepSize: 1
                        }
                    },
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Number of Users'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
