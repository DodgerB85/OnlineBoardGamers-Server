    <rect x="216" y="362" width="80" height="24" rx="8" fill="#ffffff"/>
    <rect x="232" y="402" width="48" height="18" rx="6" fill="#ffffff"/>
    <path d="M214 200c14-30 70-30 84 0" stroke="#87c2c8" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M256 200v60" stroke="#87c2c8" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
